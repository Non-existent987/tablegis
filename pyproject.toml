[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "tablegis"
version = "0.0.16"
keywords = [
    "gis", "tablegeo", "pandas", "geopandas",
    "shapefile", "Nearest", "crs", "fast-read", "polars", "parquet"
]
description = "A powerful Python library for geospatial data processing, analysis and conversion - integrating pandas with GIS operations"
readme = "README_pypi.md"
authors = [{name = "Non-existent987", email = "jiaqi0425_000@163.com"}]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "pyproj",
    "geopandas",
    "shapely",
    "polars",
    "python-calamine",
    "fastexcel",
]

[tool.scikit-build]
build.verbose = true

[tool.scikit-build.sdist]
include = [
    "tablegis/src/xlsx2csv_ext.cpp",
    "tablegis/src/libdeflate/**",
    "CMakeLists.txt",
]

[tool.scikit-build.wheel.packages]
tablegis = "tablegis"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *i686"
build-verbosity = 1

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/Non-existent987/tablegis"
"Bug Tracker" = "https://github.com/Non-existent987/tablegis/issues"
"Repository" = "https://github.com/Non-existent987/tablegis.git"
"Changelog" = "https://github.com/Non-existent987/tablegis/blob/main/CHANGELOG.md"